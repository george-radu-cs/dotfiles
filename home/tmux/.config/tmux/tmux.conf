# tmux — prefix is Ctrl-Space. Reload: prefix r.
# Needs tmux ≥ 3.3 (Debian 12 and newer, any current Arch/Fedora/Homebrew).

# --- terminal, true colour, undercurl ------------------------------------------
# tmux-256color (not screen-256color) gives italics and styled underlines inside
# tmux; RGB = 24-bit colour, usstyle = coloured undercurl (nvim diagnostics).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle:extkeys"
set -as terminal-features ",wezterm:RGB:usstyle:extkeys"
set-environment -g COLORTERM truecolor
set -ga update-environment " COLORTERM TERM_PROGRAM"

set -s escape-time 10
set -s extended-keys on
set -s set-clipboard on
set -g allow-passthrough on        # image previews (yazi), OSC sequences
set -g focus-events on             # nvim FocusGained (theme reload, autoread)
set -g history-limit 100000
set -g mouse on

# --- prefix --------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "tmux.conf reloaded"

# --- windows & panes -----------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl-h/j/k/l move between tmux panes and nvim splits (vim-tmux-navigator);
# prefix + h/j/k/l also works.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window names: the folder while you're at the shell, the program otherwise
# (e.g. "dotfiles", then "nvim" while nvim runs). Updates on its own.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Clear scrollback (Ctrl-k alone belongs to the navigator).
bind C-k send-keys C-l \; clear-history

# --- copy mode (vi) ------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- theme ---------------------------------------------------------------------
# Gruvbox defaults; `theme <name>` writes the palette to the state file below.
set -g @thm_bg "#1d2021"
set -g @thm_bg1 "#3c3836"
set -g @thm_bg2 "#504945"
set -g @thm_fg "#ebdbb2"
set -g @thm_dim "#928374"
set -g @thm_accent "#83a598"
set -g @thm_alert "#fe8019"
set -g @thm_ok "#b8bb26"
set -g @thm_warn "#fabd2f"
source-file -q "$HOME/.local/state/dotfiles/theme/tmux.conf"

set -gF status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF message-style "bg=#{@thm_bg1},fg=#{@thm_fg}"
set -gF message-command-style "bg=#{@thm_bg1},fg=#{@thm_fg}"
set -gF mode-style "bg=#{@thm_bg2},fg=#{@thm_fg}"
set -gF pane-border-style "fg=#{@thm_bg2}"
set -gF pane-active-border-style "fg=#{@thm_accent}"
set -gF copy-mode-match-style "bg=#{@thm_bg2},fg=#{@thm_warn}"
set -gF copy-mode-current-match-style "bg=#{@thm_warn},fg=#{@thm_bg}"

set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_alert},#{@thm_accent}},bold] #S #[bg=#{@thm_bg}] "
set -g status-right "#[fg=#{@thm_dim}] #{b:pane_current_path}  #[fg=#{@thm_fg}]#h "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@thm_dim}] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#{@thm_fg},bg=#{@thm_bg1},bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -gF window-status-activity-style "fg=#{@thm_warn}"

# --- plugins (tpm; prefix I installs, prefix U updates) -------------------------
# Kept out of ~/.config/tmux so the repo stays clean.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

if "test -x $HOME/.local/share/tmux/plugins/tpm/tpm" \
   "run '$HOME/.local/share/tmux/plugins/tpm/tpm'"
