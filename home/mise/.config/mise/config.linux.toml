# Linux only (loaded because env.zsh sets MISE_ENV=linux): CLI tools.
# Distro versions are old or missing (Debian's neovim is too old for LazyVim;
# starship, lazygit and yazi aren't packaged everywhere), so mise installs the
# same current versions on Arch, Fedora and Debian.
# macOS gets the same tools from packages/Brewfile.

[tools]
# --- shell & editor ----------------------------------------------------------
neovim = "latest"
starship = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
zoxide = "latest"
yazi = "latest"
jq = "latest"
tealdeer = "latest"
fastfetch = "latest"
tree-sitter = "latest"      # nvim-treesitter compiles parsers with it
shellcheck = "latest"
stylua = "latest"

# --- git & containers --------------------------------------------------------
delta = "latest"
lazygit = "latest"
gh = "latest"
opentofu = "latest"         # `tofu`: open-source Terraform; terraform-ls uses it

