# Every language toolchain and CLI tool that mise can install, on every OS:
# `mise install` sets up the same versions on macOS, Arch, Fedora and Debian.
# Homebrew / distro packages keep only what mise can't do well (zsh, tmux, btop,
# Lua, the C/C++ toolchain, LaTeX, Docker, apps). Rust: official rustup.
# Per-project versions go in a project's mise.toml / .nvmrc / .java-version.
#
# Java: the first entry is the default; switch per shell with java11 … java25
# (aliases in zsh) or per project with `mise use java@temurin-17`.
# All JDKs are Eclipse Temurin (Adoptium) builds of OpenJDK, GPLv2 + Classpath
# Exception.

[tools]
# --- languages ---------------------------------------------------------------
java = ["temurin-21", "temurin-25", "temurin-17", "temurin-11"]
node = "lts"
bun = "latest"
python = "3.15"
uv = "latest"
"pipx:ipython" = "latest"   # ipython / ipython3, isolated venv (installed with uv)
go = "latest"
"npm:typescript" = "latest" # tsc
zig = "latest"              # official Zig builds; zls (Neovim) needs the compiler
opentofu = "latest"         # `tofu`: open-source Terraform; terraform-ls uses it
flutter = "latest"          # Flutter SDK, includes Dart

# --- CLI tools ---------------------------------------------------------------
neovim = "latest"
starship = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
zoxide = "latest"
delta = "latest"
lazygit = "latest"
yazi = "latest"
gh = "latest"
jq = "latest"
tealdeer = "latest"
fastfetch = "latest"
tree-sitter = "latest"      # nvim-treesitter compiles parsers with it
shellcheck = "latest"
stylua = "latest"

[settings]
# Read .nvmrc / .node-version / .java-version / .python-version files.
idiomatic_version_file_enable_tools = ["node", "java", "python"]
