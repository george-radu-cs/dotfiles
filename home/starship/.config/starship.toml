"$schema" = "https://starship.rs/config-schema.json"

# Same layout as the old Powerlevel10k "pure" setup:
#   ~/path/to/dir  main *↑1                    3s  (venv)  user@host  14:02:11
#   ❯
# Colours are ANSI names, so they follow the active terminal theme.

add_newline = true
format = """$directory$git_branch$git_state$git_status$line_break$character"""
right_format = """$cmd_duration$python$username$hostname$time"""

[directory]
style = "bold blue"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "yellow"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "cyan"
conflicted = "="
untracked = "?"
modified = "*"
staged = "+"
deleted = "✘"
renamed = "»"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

[python]
# Only the active virtualenv, never the interpreter version.
format = '[(\($virtualenv\) )]($style)'
style = "bright-black"
detect_extensions = []
detect_files = []

[username]
format = "[$user]($style)@"
style_user = "bright-black"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bright-black"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "bright-black"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](purple)"
vimcmd_visual_symbol = "[❮](yellow)"
vimcmd_replace_symbol = "[❮](red)"
vimcmd_replace_one_symbol = "[❮](red)"
